<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimal Composer Next 0.1.5</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>Minimal Composer Next</h1><span>V0.1.5</span></header><form id="compose-form"><div class="row"><label>Provider<select id="provider"><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="google">Google</option></select></label><label>Modell<select id="model" required></select><input id="custom-model" hidden placeholder="Modell-ID" autocomplete="off" autocapitalize="none" spellcheck="false"></label></div><label>API-Key<input id="api-key" type="text" required autocomplete="off" autocapitalize="none" spellcheck="false"><small>Wird nur lokal in diesem Browser gespeichert.</small></label><label>Kompositionsauftrag<textarea id="task" rows="7" required></textarea></label><details><summary>Zusätzliche Angaben an die KI</summary><textarea id="additional" rows="7"></textarea></details><button id="compose" type="submit">Komponieren</button><p id="status" aria-live="polite"></p></form><label>Verlauf<select id="history"><option value="">Verlauf …</option></select></label><section><h2>Ergebnis</h2><textarea id="result" rows="12" readonly></textarea></section><details><summary>Vollständiges Kommunikationsprotokoll</summary><pre id="protocol"></pre></details></main><script type="module" src="src/app.js?v=0.1.5"></script></body></html>
