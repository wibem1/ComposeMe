<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimal Composer Next 0.4.0</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/abcjs-audio.css"></head><body><main><header><h1>Minimal Composer Next</h1><span>V0.4.0</span></header><form id="compose-form"><div class="row"><label>Provider<select id="provider"><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="google">Google</option></select></label><label>Modell<select id="model" required></select><input id="custom-model" hidden placeholder="Modell-ID" autocomplete="off" autocapitalize="none" spellcheck="false"></label></div><label>API-Key<input id="api-key" type="text" required autocomplete="off" autocapitalize="none" spellcheck="false"><small>Wird nur lokal in diesem Browser gespeichert.</small></label><label>Kompositionsauftrag<textarea id="task" rows="7" required></textarea></label><details><summary>Zusätzliche Angaben an die KI</summary><textarea id="additional" rows="7"></textarea></details><div class="row"><button id="compose" type="submit">Komponieren</button><button id="variant" type="button" disabled>Variante erzeugen</button></div><p id="status" aria-live="polite"></p></form><label>Verlauf<select id="history"><option value="">Verlauf …</option></select></label><section id="comparison-area"><h2>Vergleich</h2><label>Vergleichen mit<select id="comparison-choice"></select></label><div id="comparison" hidden></div></section><section id="single-result"><h2>Aktuelles Ergebnis</h2><div id="paper"></div><div id="audio"></div></section><details><summary>ABC-Ergebnis</summary><textarea id="result" rows="12" readonly></textarea></details><details><summary>Vollständiges Kommunikationsprotokoll</summary><pre id="protocol"></pre></details><details><summary>Vorhandene Experimente verbinden</summary><label>Original<select id="link-original"><option value="">Original wählen …</option></select></label><label>Variante<select id="link-variant"><option value="">Variante wählen …</option></select></label><button id="link-button" type="button">Als Original + Variante verbinden</button></details><details><summary>Diagnose Verlauf</summary><pre id="history-diagnostic"></pre></details></main><script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/dist/abcjs-basic-min.js"></script><script type="module" src="src/app.js?v=0.4.0"></script></body></html>
