<!doctype html><html lang="de"><head><meta charset="utf-8"><title>ComposeMe integrated historical smoke</title></head>
<body data-historical-ready="pending">
<iframe id="app" src="../index.html" style="width:1100px;height:800px"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',async()=>{
 try {
 const w=frame.contentWindow,d=frame.contentDocument;
 await new Promise(resolve=>setTimeout(resolve,800));
 const mode=d.getElementById('composition-process'),first=d.getElementById('historical-first-prompt');
 if(!mode||!first)throw Error('Neue UI fehlt oder App konnte nicht starten.');
 if(!d.body.textContent.includes('Originalantwort der KI'))throw Error('Modellneutrale Überschrift für KI-Antwort fehlt.');
 w.localStorage.removeItem('minimal-composer-next:experiments');
 const task='Komponiere ein Klavierstück von 32 Takten im Stil von Beethoven.';
 d.getElementById('task').value=task;
 mode.value='historical';mode.dispatchEvent(new w.Event('change',{bubbles:true}));
 const prompt=first.value;
 if(!prompt.includes('Stelle dir das verlangte Musikstück zunächst ausschließlich')||!prompt.endsWith(task))
  throw Error('Historischer Originalprompt wurde nicht geladen.');
 if(d.getElementById('provider').disabled||d.getElementById('model').disabled)
  throw Error('Provider/Modell sind im Zweistufenmodus fälschlich deaktiviert.');
 // Loading an older edited experiment must not leak its first-stage prompt into a new run.
 const originalHistorical=first.value;
 const old={mode:'historical',userInput:task,provider:'openai',model:'gpt-5.6-sol',
  historicalCalls:[{stage:'sound_concept',prompt:'Nur alter verkürzter Prompt'}],concept:'Alter Entwurf'};
 w.localStorage.setItem('minimal-composer-next:experiments',JSON.stringify([{...old,id:'old-prompt-test',savedAt:new Date().toISOString()}]));
 d.getElementById('history').add(new w.Option('Alter Test', 'old-prompt-test'));
 d.getElementById('history').value='old-prompt-test';
 d.getElementById('history').dispatchEvent(new w.Event('change'));
 if(first.value!=='Nur alter verkürzter Prompt')throw Error('Alte Anweisung wird im Verlauf nicht angezeigt.');
 // A new run must restore the canonical prompt unless the user actually edits the loaded field.
 d.getElementById('task').value=task;
 const requests=[];
 const stage1='Eine frei erfundene Klangvorstellung, die aus einem Motiv wächst.';
 const score={t:'Integrations-Teststück',b:112,m:[4,4],v:[
 ['Klavier RH',0,0,[[1,0,1,60,92],[1,1,2,67,74],[32,0,4,72,61]]],
 ['Klavier LH',0,1,[[1,0,4,36,65],[32,0,4,36,60]]]]};
 w.fetch=async(_url,options)=>{
   const body=JSON.parse(options.body);
   requests.push(body);
   return new w.Response(JSON.stringify({
      output:[{type:'message',content:[{type:'output_text',text:requests.length%2===1?stage1:JSON.stringify(score)}]}],
      usage:{input_tokens:100,output_tokens:200,total_tokens:300}
   }),{status:200,headers:{'Content-Type':'application/json'}});
 };
 d.getElementById('api-key-openai').value='browser-only-test-key';
 d.getElementById('api-key-openai').dispatchEvent(new w.Event('input'));
 const keyBefore=w.localStorage.getItem('minimal-composer-next:key:openai');
 d.getElementById('historical-pause').checked=true;
 d.getElementById('compose-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
 for(let i=0;i<50;i++){
  await new Promise(resolve=>setTimeout(resolve,100));
  if(d.getElementById('historical-proceed').disabled===false)break;
 }
 if(requests.length!==1)throw Error('Vor dem Fortsetzen darf nur KI-Aufruf 1 erfolgt sein: '+requests.length);
 const storedAfterStage1=JSON.parse(w.localStorage.getItem('minimal-composer-next:experiments')||'[]');
 if(storedAfterStage1.length!==2)throw Error('Zwischenstand nach KI-Aufruf 1 wurde nicht genau einmal gespeichert.');
 const interim=storedAfterStage1[0];
 if(requests[0].input[0].content[0].text!==originalHistorical)throw Error('Alter Prompt wurde in den neuen Versuch übernommen.');
 if(interim.runStatus!=='stage1_completed'||interim.historicalCalls?.length!==1||interim.historicalCalls?.[0]?.response!==stage1)
  throw Error('Gespeicherter Zwischenstand nach KI-Aufruf 1 ist unvollständig.');
 if(!d.getElementById('protocol').textContent.includes(stage1))
  throw Error('Kommunikationsprotokoll zeigt den gespeicherten KI-Aufruf 1 nicht sofort.');
 d.getElementById('historical-proceed').click();
 for(let i=0;i<50;i++){
  await new Promise(resolve=>setTimeout(resolve,100));
  if(d.getElementById('result').value.includes('Integrations-Teststück'))break;
 }
 if(requests.length!==2)throw Error('Nach Fortsetzen werden genau zwei KI-Aufrufe erwartet: '+requests.length);
 const storedFinished=JSON.parse(w.localStorage.getItem('minimal-composer-next:experiments')||'[]');
 if(storedFinished.length!==2||storedFinished[0].id!==interim.id||storedFinished[0].runStatus!=='completed')
  throw Error('Fertiger Lauf muss denselben Verlaufseintrag aktualisieren statt einen zweiten anzulegen.');
 if(requests[0].input[0].content[0].text!==originalHistorical)throw Error('Erster KI-Prompt wurde verändert.');
 const second=requests[1].input[0].content[0].text;
 if(!second.includes(stage1)||!second.includes(task)||!second.includes('TECHNISCHES FORMAT'))
  throw Error('Historischer zweiter Prompt enthält nicht die exakten Eingaben.');
 if(!d.getElementById('historical-concept').value.includes(stage1))
  throw Error('Erste Antwort wird nicht sichtbar angezeigt.');
 const text=d.getElementById('protocol').textContent;
 if(!text.includes(stage1)||!text.includes('TATSÄCHLICHE KI-ANFRAGE'))
  throw Error('Historischer Kommunikationsverlauf fehlt.');
 // Diagnosis export must not change or export stored API keys.
 d.getElementById('diagnostic-save').click();
 if(w.localStorage.getItem('minimal-composer-next:key:openai')!==keyBefore || d.getElementById('api-key-openai').value!=='browser-only-test-key')
  throw Error('Diagnosis export modified the stored OpenAI key.');
 if(!d.getElementById('diagnosis-section').contains(d.getElementById('diagnostic-save')))
  throw Error('Diagnosis export is not in its own section.');
 if(d.getElementById('technical').contains(d.getElementById('diagnostic-save')))
  throw Error('Diagnosis export still appears under Technisches.');
 const paper=d.getElementById('paper'),audio=d.getElementById('audio');
 const midiPlayer=audio.querySelector('.midi-player[data-source="original-midi"]');
 if(!midiPlayer)throw Error('Original-MIDI-Player fehlt.');
 if(audio.querySelector('.abcjs-inline-audio'))throw Error('Historischer Modus darf keinen ABC-Player verwenden.');
 if(!midiPlayer.textContent.includes('Original-MIDI'))throw Error('MIDI-Quelle ist nicht sichtbar bezeichnet.');
 const hist=d.getElementById('history');
 if(![...hist.options].some(x=>x.textContent.includes('Integrations-Teststück')))
  throw Error('Historische Komposition nicht im bestehenden Verlauf gespeichert.');
 // Regression: diagnostic export must not modify saved keys or the visible key inputs.
 const savedKeys={openai:'browser-only-test-key',anthropic:'other-test-key',google:'third-test-key'};
 for(const [name,value] of Object.entries(savedKeys)){
  const input=d.getElementById('api-key-'+name);
  input.value=value;
  input.dispatchEvent(new w.Event('input',{bubbles:true}));
 }
 const diagnosticButton=d.getElementById('diagnostic-save');
 if(d.getElementById('technical').contains(diagnosticButton))
  throw Error('Diagnoseknopf befindet sich noch innerhalb von Technisches.');
 if(!d.getElementById('diagnosis-section').contains(diagnosticButton))
  throw Error('Eigenständige Rubrik Diagnose fehlt.');
 // Also simulate browser autofill: a visible key may not have fired an input event yet.
 const autofilled='autofilled-without-input-event';
 d.getElementById('api-key-google').value=autofilled;
 diagnosticButton.click();
 if(w.localStorage.getItem('minimal-composer-next:key:google')!==autofilled)
  throw Error('Browser-autofilled key was not persisted before diagnostic download.');
 savedKeys.google=autofilled;
 for(const [name,value] of Object.entries(savedKeys)){
  if(w.localStorage.getItem('minimal-composer-next:key:'+name)!==value)
   throw Error('Diagnoseexport hat gespeicherten '+name+'-Key verändert.');
  if(d.getElementById('api-key-'+name).value!==value)
   throw Error('Diagnoseexport hat sichtbaren '+name+'-Key verändert.');
 }
 // Regression: opening an archived customized prompt must not reuse it silently on next submit.
 const oldPrompt='ALTE GEKÜRZTE HISTORISCHE ANWEISUNG, NICHT ERNEUT SENDEN';
 const items=JSON.parse(w.localStorage.getItem('minimal-composer-next:experiments'));
 const older={...items[0],id:'archived-customized-test',savedAt:'2026-09-01T12:00:00.000Z',
  historicalCalls:[{...items[0].historicalCalls[0],prompt:oldPrompt},items[0].historicalCalls[1]]};
 w.localStorage.setItem('minimal-composer-next:experiments',JSON.stringify([older,...items]));
 const selectHistory=d.getElementById('history');
 selectHistory.appendChild(new w.Option('alter bearbeiteter Versuch',older.id));
 selectHistory.value=older.id;
 selectHistory.dispatchEvent(new w.Event('change',{bubbles:true}));
 if(first.value!==oldPrompt)throw Error('Historischer alter Prompt lässt sich nicht anzeigen.');
 d.getElementById('historical-pause').checked=false;
 d.getElementById('compose-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
 for(let i=0;i<60;i++){
  await new Promise(resolve=>setTimeout(resolve,100));
  if(requests.length===4)break;
 }
 if(requests.length!==4)throw Error('Zweiter Testlauf hat nicht genau zwei weitere Modellanfragen erzeugt.');
 if(requests[2].input[0].content[0].text!==prompt)
  throw Error('ALTER HISTORISCHER PROMPT WURDE UNBEMERKT ÜBERNOMMEN.');
 document.body.dataset.diagnosticKeysPreserved='true';
 document.body.dataset.archivedPromptIsolated='true';
 document.body.dataset.historicalReady='true';
 document.body.dataset.promptUnchanged='true';
 document.body.dataset.calls='2';
 document.body.dataset.historySaved='true';
 document.body.dataset.stage1Persisted='true';
 document.body.dataset.midiSource='original';
 document.body.dataset.noAbcPlayer='true';
 document.body.dataset.modelSelectable='true';
 document.body.dataset.promptIsolation='true';
 document.body.dataset.keyPreserved='true';
 }catch(e){
 document.body.dataset.historicalReady='false';document.body.dataset.error=e?.stack||String(e);
 }
});
</script></body></html>
