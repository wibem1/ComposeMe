<!doctype html>
<html><head><meta charset="utf-8"><title>ComposeMe browser render test</title></head>
<body data-render-success="pending">
<div id="paper"></div><div id="audio"></div><div id="abendlicht-paper"></div><div id="abendlicht-audio"></div>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/dist/abcjs-basic-min.js"></script>
<script type="module">
import {renderMusic,normalizeAbcForAbcjs} from '../src/music-view.js?v=0.7.7';
import {abcToMusicXml} from '../src/abc-to-musicxml.js';
import {normalizeMidiBinary,assertMidiFile,svgFileText,printableHtml} from '../src/export-core.js';
try {
  const abc=await (await fetch('./fixtures/valse-melancolique.abc')).text();
  const normalized=normalizeAbcForAbcjs(abc);
  const visual=renderMusic({abc,ABCJS:window.ABCJS,paper:document.getElementById('paper'),audio:document.getElementById('audio')});
  document.body.dataset.violinProgramDirective=String(normalized.includes('%%MIDI program 40'));
  const midi=ABCJS.synth.getMidiFile(normalized,{midiOutputType:'binary'});
  const bytes=assertMidiFile(normalizeMidiBinary(midi));
  let violinProgram=false;
  for(let i=0;i<bytes.length-1;i++)if((bytes[i]&0xF0)===0xC0&&bytes[i+1]===40){violinProgram=true;break;}
  document.body.dataset.violinProgramMidi=String(violinProgram);
  const musicXml=abcToMusicXml(normalized);
  const svgText=svgFileText(document.querySelector('#paper svg'),'Valse');
  document.body.dataset.abcExport=String(normalized.startsWith('X:1')&&normalized.includes('T:Valse mélancolique'));
  document.body.dataset.midiExport=String(bytes.length>14&&String.fromCharCode(...bytes.slice(0,4))==='MThd');
  document.body.dataset.musicxmlExport=String(musicXml.includes('<score-partwise')&&musicXml.includes('<part-name>Violine</part-name>')&&musicXml.includes('<part-name>Klavier</part-name>'));
  document.body.dataset.svgExport=String(svgText.includes('<svg')&&svgText.length>1000);
  const printHtml=printableHtml(document.querySelector('#paper svg'),'Valse');
  document.body.dataset.printExport=String(printHtml.includes('window.print()')&&printHtml.includes('<svg'));
  const svgCount=document.querySelectorAll('#paper svg').length;
  const noteCount=document.querySelectorAll('#paper .abcjs-note').length;
  document.body.dataset.svgCount=String(svgCount);
  document.body.dataset.noteCount=String(noteCount);
  document.body.dataset.lineCount=String(visual?.lines?.length??0);
  document.body.dataset.warningCount=String(visual?.warnings?.length??0);
  const pre=document.createElement('pre');pre.id='warnings';pre.textContent=JSON.stringify(visual?.warnings??[]);document.body.append(pre);
  const rangeWarning=document.querySelector('#paper .notation-warning')?.textContent??'';
  document.body.dataset.rangeWarning=String(Boolean(rangeWarning));
  const abendlicht=await (await fetch('./fixtures/abendlicht-original.abc')).text();
  const piano=renderMusic({abc:abendlicht,ABCJS:window.ABCJS,
    paper:document.getElementById('abendlicht-paper'),audio:document.getElementById('abendlicht-audio')});
  document.body.dataset.abendlichtLines=String(piano?.lines?.length??0);
  document.body.dataset.abendlichtPaired=String(piano?.lines?.length===4 && piano.lines.every(line=>line.staff?.length===2));
  document.body.dataset.abendlichtWarnings=String(piano?.warnings?.length??0);
  const beamed=normalizeAbcForAbcjs(abendlicht);
  document.body.dataset.abendlichtBeaming=String(beamed.includes('A,,E, A,C EC A,E,'));
  document.body.dataset.abendlichtBassBeamCount=String(document.querySelectorAll('#abendlicht-paper .abcjs-beam-elem.abcjs-v1').length);
  document.body.dataset.renderSuccess=String(svgCount>0 && noteCount>0);
} catch (error) {
  document.body.dataset.renderSuccess='false';
  document.body.dataset.renderError=error?.message??String(error);
}
</script>
</body></html>
